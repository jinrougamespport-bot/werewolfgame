<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";

        async function checkServer() {
            try {
                // ngrokの警告を無視して、とりあえず中身を取りに行く
                const response = await fetch(ngrokUrl, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
            
                const text = await response.text();
            
                // 【ここを調整してください】
                // 人狼ゲームのログイン画面にあるはずの文字（例: 「人狼」や「ログイン」）
                // が含まれているかチェックします。
                const isGameRunning = text.includes("人狼") || text.includes("Wolf") || text.includes("ログイン");
                
                // ngrokのエラー文字が含まれていないことも確認
                const isNotError = !text.includes("ERR_NGROK") && !text.includes("browser-warning");
            
                if (isGameRunning && isNotError) {
                    console.log("Game is detected! Moving now...");
                    window.location.href = ngrokUrl;
                } else {
                    console.log("Still maintenance or ngrok page.");
                }
            } catch (error) {
                // セキュリティ制限（CORS）で中身が読めない場合、ここに来ます。
                // その場合は「とにかく接続ができた（OPTIONSが200だった）」ことだけを信じて飛ばします。
                console.log("CORS restriction, but trying to redirect anyway.");
                
                // サーバーが本当に落ちていれば、ここでの fetch 自体が失敗するので
                // 落ちている時はリダイレクトされません。
                if (error.name !== 'TypeError') {
                     window.location.href = ngrokUrl;
                }
            }
        }
    
        setInterval(checkServer, 7000); // 7秒ごとにチェック
        checkServer();
    </script>
</body>
</html>
