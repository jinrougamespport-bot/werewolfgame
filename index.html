<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";

        async function checkServer() {
            try {
                const response = await fetch(ngrokUrl, {
                    method: 'GET',
                    // ngrokの警告画面をスキップする魔法のヘッダー
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
            
                // ngrokのエラー画面(3200等)の場合、レスポンスヘッダーに 'ngrok-error-code' が含まれます。
                // これが含まれている場合は「メンテナンス中」とみなし、リダイレクトしません。
                if (response.ok && !response.headers.get('ngrok-error-code')) {
                    console.log("Game server is live! Redirecting...");
                    window.location.href = ngrokUrl;
                } else {
                    console.log("Maintenance mode: ngrok is offline (error page detected).");
                }
            } catch (error) {
                // 完全に接続できない場合
                console.log("Server is offline. Staying on maintenance page.");
            }
        }
    
        // 10秒おきに実行
        setInterval(checkServer, 10000);
        checkServer();
    </script>
</body>
</html>
