<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";

        async function checkServer() {
            try {
                // 'ngrok-skip-browser-warning' を送って、警告画面を無理やり突破して中身を確認する
                const response = await fetch(ngrokUrl, {
                    method: 'GET',
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                const text = await response.text();

                // 以下の条件をすべて満たした時だけ「サーバー稼働中」とみなす
                // 1. レスポンスが正常 (200 OK)
                // 2. 内容に "ERR_NGROK" (エラー) が含まれていない
                // 3. 内容に "ngrok-skip-browser-warning" (警告画面のボタン) が含まれていない
                if (response.ok && !text.includes("ERR_NGROK") && !text.includes("browser-warning")) {
                    console.log("Game server is truly live! Redirecting...");
                    window.location.href = ngrokUrl;
                } else {
                    console.log("Still in maintenance: ngrok is showing an error or warning page.");
                }
            } catch (error) {
                console.log("Server is offline.");
            }
        }

        // 10秒おきにチェック
        setInterval(checkServer, 10000);
        checkServer();
    </script>
</body>
</html>
