<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";

        async function checkServer() {
            try {
                // セキュリティ制限を回避しつつ、テキストを取得するために proxy を通すか、
                // シンプルに fetch の挙動を利用します。
                const response = await fetch(ngrokUrl, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
            
                const text = await response.text();
            
                // 1. あなたが指定したキーワードが含まれているか
                // 2. ngrokのエラー画面ではないか
                const hasLogin = text.includes("ログイン") || text.includes("新規登録");
                const isNotError = !text.includes("ERR_NGROK");
            
                if (hasLogin && isNotError) {
                    console.log("Login page detected! Redirecting...");
                    window.location.href = ngrokUrl;
                } else {
                    console.log("Target text not found. Staying in maintenance.");
                }
            } catch (error) {
                // CORSエラー（TypeError）が出た場合でも、
                // 「接続自体はできている」可能性が高いので、
                // サーバーが生きていると確信できるなら飛ばす設定にします。
                console.log("CORS error occurred, but checking connectivity...");
                
                // シンプルな接続確認だけ行う
                fetch(ngrokUrl, { mode: 'no-cors' })
                    .then(() => {
                        // 何かしらの応答があれば、ログイン画面へ
                        window.location.href = ngrokUrl;
                    })
                    .catch(() => {
                        console.log("Server is truly offline.");
                    });
            }
        }
    
        // 5秒おきにチェック（少し早めました）
        setInterval(checkServer, 5000);
        checkServer();
    </script>
</body>
</html>
