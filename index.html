<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";
        
        async function checkServer() {
            try {
                // mode: 'no-cors' を使うことで、セキュリティ制限を回避して
                // 「サーバーから何らかの反応があるか」だけをチェックします。
                await fetch(ngrokUrl, {
                    mode: 'no-cors',
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
            
                // ここまで来れた（catchに行かなかった）ということは、
                // ngrokのサーバー自体はオンラインであると判断してリダイレクトします。
                console.log("Server detected! Redirecting...");
                window.location.href = ngrokUrl;
                
            } catch (error) {
                // サーバーが止まっている（ngrokを閉じた）時はここに来ます。
                console.log("Server is offline. Staying on maintenance page.");
            }
        }
    
        // 10秒おきにチェック
        setInterval(checkServer, 10000);
        // 初回実行
        checkServer();
    </script>
</body>
</html>
