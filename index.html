<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";

        async function checkServer() {
            try {
                const response = await fetch(ngrokUrl, {
                    method: 'GET',
                    headers: {
                        'ngrok-skip-browser-warning': 'true' // 警告画面をスキップ
                    }
                });
            
                // 【ここが最重要ポイント】
                // ngrokがエラー画面を出している時、レスポンスヘッダーに必ず 'ngrok-error-code' が含まれます。
                // これが存在する場合は、たとえ response.ok が true でもリダイレクトさせません。
                const ngrokError = response.headers.get('ngrok-error-code');
            
                if (response.ok && !ngrokError) {
                    console.log("Game server is truly live! Redirecting...");
                    window.location.href = ngrokUrl;
                } else {
                    console.log("Maintenance: ngrok is showing an error page (Code: " + ngrokError + ")");
                }
            } catch (error) {
                console.log("Server is completely offline. Staying on maintenance page.");
            }
        }
    
        // 10秒おきにチェック
        setInterval(checkServer, 10000);
        checkServer();
    </script>
</body>
</html>
