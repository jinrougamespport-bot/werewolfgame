<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンス中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maintenance-container">
        <img src="favicon.ico" class="maintenance-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div style="display:none; font-size: 64px; margin-bottom: 20px;">⚙️</div>
        
        <h1>現在メンテナンス中です</h1>

        <div class="maintenance-schedule">
            <span class="schedule-label">Next Live</span>
            <div class="schedule-date">2026年3月28日 (土)</div>
            <div class="schedule-time">10:00 〜 開始予定</div>
        </div>

        <p>
            更新が終わり次第プレイできるようになります<br>
            もうしばらくお待ちください
        </p>
    </div>

    <div class="maintenance-footer">
        werewolfgame system
    </div>

    <script>
        // メインプログラム側のngrok URL
        const ngrokUrl = "https://yawnful-oligarchic-von.ngrok-free.dev";

        async function checkServer() {
            try {
                // ngrok特有の警告画面(ERR_NGROK_6024等)をスキップして中身を確認
                const response = await fetch(ngrokUrl, {
                    method: 'GET',
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                // response.ok はステータスコードが 200-299 の時だけ true になります。
                // ngrokのエラー画面（3200番など）は通常 404 や 503 なので、
                // ゲームが正常に動いている時だけリダイレクトされます。
                if (response.ok) {
                    window.location.href = ngrokUrl;
                }
            } catch (error) {
                // サーバーが落ちている（ngrokコマンドが止まっている）間はここに来ます
                console.log("Server is offline. Keeping maintenance page.");
            }
        }

        // 10秒ごとにサーバーが復活したかチェックする
        setInterval(checkServer, 10000);

        // 初回実行
        checkServer();
    </script>
</body>

</html>
